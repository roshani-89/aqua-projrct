<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | AquaCare</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="water-gradient-subtle d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-droplet-half"></i></span>
        <span>Aqua<span class="text-primary">Care</span></span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="login.html" class="btn btn-sm btn-outline-primary">
          <i class="bi bi-box-arrow-in-right me-1"></i> Already Registered? Log In
        </a>
      </div>
    </div>
  </nav>

  <!-- Registration Main -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-9 col-lg-7">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
            
            <div class="card-header water-gradient-bg text-white text-center py-4 border-0">
              <div class="bg-white text-primary rounded-circle d-inline-flex p-3 fs-3 mb-2 shadow-sm">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h4 class="fw-bold mb-1">Create an AquaCare Account</h4>
              <p class="small text-white-50 mb-0">Join thousands of households enjoying pure, clean drinking water</p>
            </div>

            <div class="card-body p-4 p-md-5">

              <!-- Alert Box -->
              <div id="regAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

              <form id="registrationForm" onsubmit="handleRegistration(event)">
                
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                      <input type="text" class="form-control" id="regName" placeholder="e.g. Anjali Deshmukh" required>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Mobile Phone *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light">+91</span>
                      <input type="tel" class="form-control" id="regPhone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                    </div>
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold">Email Address *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                      <input type="email" class="form-control" id="regEmail" placeholder="your.name@example.com" required>
                    </div>
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold">Complete Address (For Water Purifier Visits)</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-geo-alt"></i></span>
                      <textarea class="form-control" id="regAddress" rows="2" placeholder="Flat No., Society / Building, Landmark, City & Pincode"></textarea>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Password *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                      <input type="password" class="form-control" id="regPassword" placeholder="At least 6 characters" minlength="6" required>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Confirm Password *</label>
                    <div class="input-group">
                      <span class="input-group-text bg-light"><i class="bi bi-check2-circle"></i></span>
                      <input type="password" class="form-control" id="regConfirmPassword" placeholder="Re-enter password" minlength="6" required>
                    </div>
                  </div>

                  <div class="col-12 mt-3">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="regTerms" required>
                      <label class="form-check-label small text-muted" for="regTerms">
                        I agree to the <a href="contact.html" class="text-primary text-decoration-none">Terms of Service</a> & <a href="contact.html" class="text-primary text-decoration-none">Privacy Policy</a>
                      </label>
                    </div>
                  </div>

                  <div class="col-12 mt-4">
                    <button type="submit" id="regSubmitBtn" class="btn btn-aqua btn-lg w-100 fw-bold py-2">
                      <i class="bi bi-person-check-fill me-1"></i> Register Free Account
                    </button>
                  </div>
                </div>

              </form>

              <hr class="my-4">

              <div class="text-center small text-muted">
                Already registered with AquaCare? <br>
                <a href="login.html" class="fw-bold text-primary text-decoration-none">Click here to Sign In</a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-dark text-white-50 text-center small mt-auto">
    &copy; 2026 AquaCare - Online Water Service Booking Website.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleRegistration(e) {
      e.preventDefault();
      const alertBox = document.getElementById('regAlert');
      alertBox.style.display = 'none';

      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const address = document.getElementById('regAddress').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      if (password !== confirmPassword) {
        alertBox.innerText = 'Passwords do not match. Please re-enter carefully.';
        alertBox.style.display = 'block';
        return;
      }

      const submitBtn = document.getElementById('regSubmitBtn');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';
      submitBtn.disabled = true;

      try {
        const user = await registerUserAsync({
          name,
          phone,
          email,
          address,
          password
        });

        showToast(`Account created successfully! Welcome, ${user.name}!`, 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);

      } catch (err) {
        alertBox.innerText = err.message || 'Registration failed. Please try again.';
        alertBox.style.display = 'block';
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
