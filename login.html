<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AquaCare</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="water-gradient-subtle d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <span class="brand-icon"><i class="bi bi-droplet-half"></i></span>
        <span>Aqua<span class="text-primary">Care</span></span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="index.html" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i> Back to Home
        </a>
      </div>
    </div>
  </nav>

  <!-- Login Form Container -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white">
            
            <div class="card-header water-gradient-bg text-white text-center py-4 border-0">
              <div class="bg-white text-primary rounded-circle d-inline-flex p-3 fs-3 mb-2 shadow-sm">
                <i class="bi bi-person-lock"></i>
              </div>
              <h4 class="fw-bold mb-1">Welcome to AquaCare</h4>
              <p class="small text-white-50 mb-0">Sign in to manage water service bookings and track status</p>
            </div>

            <div class="card-body p-4 p-md-5">

              <!-- Demo Credentials Shortcut Pill Buttons -->
              <div class="mb-4 p-3 bg-light rounded-3 text-center border">
                <small class="fw-semibold text-muted d-block mb-2">⚡ Quick Demo Login Credentials:</small>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                  <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="fillCredentials('rahul.sharma@example.com', 'customer123')">
                    <i class="bi bi-person me-1"></i> Customer Demo
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-dark rounded-pill px-3" onclick="fillCredentials('admin@aquacare.com', 'admin123')">
                    <i class="bi bi-shield-lock me-1"></i> Admin Demo
                  </button>
                </div>
              </div>

              <!-- Error Alert -->
              <div id="loginAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

              <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email Address</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="loginEmail" placeholder="Enter your email" required>
                  </div>
                </div>

                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label fw-semibold mb-0">Password</label>
                    <a href="javascript:void(0)" onclick="alert('Demo Passwords:\nCustomer: customer123\nAdmin: admin123')" class="small text-primary text-decoration-none">Forgot?</a>
                  </div>
                  <div class="input-group mt-1">
                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('loginPassword', this)">
                      <i class="bi bi-eye"></i>
                    </button>
                  </div>
                </div>

                <div class="mb-4 form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                  <label class="form-check-label small text-muted" for="rememberMe">Remember me on this browser</label>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-aqua btn-lg w-100 fw-bold py-2">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Log In to AquaCare
                </button>
              </form>

              <hr class="my-4">

              <div class="text-center small text-muted">
                Don't have an AquaCare account yet? <br>
                <a href="register.html" class="fw-bold text-primary text-decoration-none">Create a Free Customer Account</a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-dark text-white-50 text-center small mt-auto">
    &copy; 2026 AquaCare - Online Water Service Booking Website.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    function fillCredentials(email, pass) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
      document.getElementById('loginAlert').style.display = 'none';
    }

    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      if (field.type === 'password') {
        field.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        field.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      alertBox.style.display = 'none';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const submitBtn = document.getElementById('loginSubmitBtn');
      const originalText = submitBtn.innerHTML;

      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in...';
      submitBtn.disabled = true;

      try {
        const user = await loginUserAsync(email, password);
        showToast(`Welcome back, ${user.name}!`, 'success');

        // Check if there is a redirect query or redirect based on role
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');

        setTimeout(() => {
          if (redirectUrl) {
            window.location.href = redirectUrl;
          } else if (user.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 800);

      } catch (err) {
        alertBox.innerText = err.message || 'Login failed. Please verify your credentials.';
        alertBox.style.display = 'block';
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
